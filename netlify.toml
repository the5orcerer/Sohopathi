[build]
  command = "npm run build"
  functions = "api"

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/index"
  status = 200

[[redirects]]
  from = "/debug-sentry"
  to = "/.netlify/functions/index"
  status = 200

[[redirects]]
  from = "/docs/*"
  to = "/.netlify/functions/index"
  status = 200

[[redirects]]
  from = "/docs"
  to = "/.netlify/functions/index"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/index"
  status = 200

