version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: biddyapith_postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: biddyapith_dev
    volumes:
      - biddyapith_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d biddyapith_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  s3:
    image: minio/minio:latest
    container_name: biddyapith_s3
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - biddyapith_s3data:/data

volumes:
  biddyapith_pgdata:
    name: biddyapith_pgdata
  biddyapith_s3data:
    name: biddyapith_s3data

